# What Is Javascript ->  JavaScript is a dynamically typed, single-threaded, synchronous language.

Dynamically Typed: Variable type is decided at runtime.
Single-Threaded: JavaScript executes one task at a time.
Synchronous: Code runs line by line in order.





JavaScript Engines ->  JavaScript Engine is a program that reads, converts, and executes JavaScript code so the computer can understand it.
👉 Simple: JavaScript Engine = JavaScript code ko run karne wala program.

Example :  
- Chrome → V8 Engine
- Firefox → SpiderMonkey
- Safari → JavaScriptCore






JavaScript was invented in May 1995 by American programmer Brendan Eich.  
It just developed in 10 - 12 Days. 




ECMAScript ->  ECMAScript is a company that manages/defines the rules of JavaScript.





Compiled Language — Code is compiled as a whole before execution.
Example - C , C++ . Rust , Go , Swift

Interpreted Language — Code Execute Line By Line. 
Example - Python , JavaScript , Ruby , Perl , PHP






JIT (Just-In-Time Compilation) -> IT compiles the code at runtime and then executes it. JavaScript uses JIT in modern engines.

JS Code → JIT Compiler → Machine Code → Execute
