

# INTERNAL CSS

<!-- Internal CSS ka example ( <style> Tag Ki Help se hum Internal CSS Use karte hain )
Kyuki ye jo CSS hai wo HTML Documents ke andar hi hai mtb me jo bhi CSS likhunga wo HTML Document ke andar hi hoga -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1 {
            color: blue;
            font-size: 24px;
        }
    </style>

</head>
<body>
    
    <h1>Hello, World!</h1>

</body>
</html>
