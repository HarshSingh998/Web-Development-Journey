
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Learning Journey</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="Style_NYC_.css">
</head>

<body>

    <!-- Main Heading -->
    <h1>Learn CSS</h1>

    <!-- ID Selector -->
    <h2 id="heading">CSS Learning Journey</h2>

    <!-- Class Selector -->
    <h2 class="heading">Welcome to CSS</h2>

    <!-- Paragraph -->
    <p>
        I am learning CSS from beginner to advanced level.
        I will practice every concept step by step.
    </p>

    <!-- Flexbox Container -->
    <div class="div">

        <!-- First Box -->
        <div class="first">
            <h3>HTML</h3>
            <p>HTML creates the structure of a webpage.</p>
        </div>

        <!-- Second Box -->
        <div class="second">
            <h3>CSS</h3>
            <p>CSS styles the webpage.</p>
        </div>

    </div>

</body>
</html>
