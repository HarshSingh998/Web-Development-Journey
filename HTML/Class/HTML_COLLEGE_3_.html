<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login & Registration Form</title>

</head>


<body>


    <!-- ================================================= -->
    <!--                 LOGIN FORM                        -->
    <!-- ================================================= -->

    <h1>LOGIN FORM</h1>

    <form action="./HTML_COLLEGE_2_.html" method="get">

        <!-- Username -->

        <label for="login_username">
            Username:
        </label>

        <input
            type="text"
            id="login_username"
            name="username"
            placeholder="Enter Username"
            required
        >

        <br><br>


        <!-- Email -->

        <label for="login_email">
            Gmail / Email:
        </label>

        <input
            type="email"
            id="login_email"
            name="email"
            placeholder="Enter Gmail"
            required
        >

        <br><br>


        <!-- Password -->

        <label for="login_password">
            Password:
        </label>

        <input
            type="password"
            id="login_password"
            name="password"
            placeholder="Enter Password"
            required
            minlength="8"
        >

        <br><br>


        <!-- Remember Me -->

        <input
            type="checkbox"
            id="remember"
            name="remember"
            value="yes"
        >

        <label for="remember">
            Remember Me
        </label>

        <br><br>


        <!-- Submit -->

        <button type="submit">
            Login
        </button>


        <!-- Reset -->

        <button type="reset">
            Reset
        </button>

    </form>


    <hr>
    <hr>
    <hr>
    


    <!-- ================================================= -->
    <!--              REGISTRATION FORM                    -->
    <!-- ================================================= -->

    <h1>REGISTRATION FORM</h1>

    <form action="/register" method="post">


        <!-- ================= NAME ================= -->

        <label for="fullname">
            Full Name:
        </label>

        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter Full Name"
            required
        >

        <br><br>


        <!-- ================= USERNAME ================= -->

        <label for="username">
            Username:
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Username"
            minlength="3"
            maxlength="20"
            required
        >

        <br><br>


        <!-- ================= EMAIL ================= -->

        <label for="email">
            Gmail / Email:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <br><br>


        <!-- ================= PASSWORD ================= -->

        <label for="password">
            Password:
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            minlength="8"
            maxlength="30"
            required
        >

        <br><br>


        <!-- ================= CONFIRM PASSWORD ================= -->

        <label for="confirm_password">
            Confirm Password:
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter Password"
            minlength="8"
            required
        >

        <br><br>


        <!-- ================= AGE ================= -->

        <label for="age">
            Age:
        </label>

        <input
            type="number"
            id="age"
            name="age"
            min="1"
            max="100"
            placeholder="Enter Age"
            required
        >

        <br><br>


        <!-- ================= DATE OF BIRTH ================= -->

        <label for="dob">
            Date of Birth:
        </label>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >

        <br><br>


        <!-- ================= PHONE ================= -->

        <label for="phone">
            Phone Number:
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter Phone Number"
            required
        >

        <br><br>


        <!-- ================= GENDER ================= -->

        <h3>Gender</h3>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
        >

        <label for="male">
            Male
        </label>


        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >

        <label for="female">
            Female
        </label>


        <input
            type="radio"
            id="other"
            name="gender"
            value="other"
        >

        <label for="other">
            Other
        </label>

        <br><br>


        <!-- ================= SKILLS ================= -->

        <h3>Skills</h3>

        <input
            type="checkbox"
            id="html"
            name="skills"
            value="HTML"
        >

        <label for="html">
            HTML
        </label>


        <input
            type="checkbox"
            id="css"
            name="skills"
            value="CSS"
        >

        <label for="css">
            CSS
        </label>


        <input
            type="checkbox"
            id="javascript"
            name="skills"
            value="JavaScript"
        >

        <label for="javascript">
            JavaScript
        </label>

        <br><br>


        <!-- ================= CITY ================= -->

        <label for="city">
            City:
        </label>

        <select
            id="city"
            name="city"
            required
        >

            <option value="">
                -- Select City --
            </option>

            <option value="indore">
                Indore
            </option>

            <option value="delhi">
                Delhi
            </option>

            <option value="mumbai">
                Mumbai
            </option>

            <option value="bangalore">
                Bangalore
            </option>

            <option value="pune">
                Pune
            </option>

        </select>

        <br><br>


        <!-- ================= ADDRESS ================= -->

        <label for="address">
            Address:
        </label>

        <br>

        <textarea
            id="address"
            name="address"
            rows="5"
            cols="40"
            placeholder="Enter your complete address"
        ></textarea>

        <br><br>


        <!-- ================= WEBSITE ================= -->

        <label for="website">
            Website:
        </label>

        <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
        >

        <br><br>


        <!-- ================= PROFILE PHOTO ================= -->

        <label for="profile">
            Profile Photo:
        </label>

        <input
            type="file"
            id="profile"
            name="profile"
        >

        <br><br>


        <!-- ================= FAVORITE COLOR ================= -->

        <label for="color">
            Favorite Color:
        </label>

        <input
            type="color"
            id="color"
            name="color"
        >

        <br><br>


        <!-- ================= TERMS ================= -->

        <input
            type="checkbox"
            id="terms"
            name="terms"
            value="accepted"
            required
        >

        <label for="terms">
            I agree to the Terms and Conditions
        </label>

        <br><br>


        <!-- ================= BUTTONS ================= -->

        <button type="submit">
            Register
        </button>

        <button type="reset">
            Reset
        </button>

    </form>


</body>

</html>
