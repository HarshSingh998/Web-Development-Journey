<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <h1>FEEDBACK FORM</h1>

    <form action="/feedback" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input 
            type="text" 
            id="name" 
            name="name"
            placeholder="Enter your name"
            required
        >
        <br><br>


        <!-- Email -->
        <label for="email">Gmail / Email:</label>
        <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="example@gmail.com"
            required
        >
        <br><br>


        <!-- Age -->
        <label for="age">Age:</label>
        <input 
            type="number" 
            id="age" 
            name="age"
            min="1"
            max="100"
            placeholder="Enter your age"
            required
        >
        <br><br>


        <!-- Subject -->
        <label for="subject">Feedback Subject:</label>
        <input 
            type="text" 
            id="subject" 
            name="subject"
            placeholder="Enter feedback subject"
            required
        >
        <br><br>


        <!-- Rating -->
        <h3>How would you rate your experience?</h3>

        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1">1 ⭐</label>

        <input type="radio" id="rating2" name="rating" value="2">
        <label for="rating2">2 ⭐</label>

        <input type="radio" id="rating3" name="rating" value="3">
        <label for="rating3">3 ⭐</label>

        <input type="radio" id="rating4" name="rating" value="4">
        <label for="rating4">4 ⭐</label>

        <input type="radio" id="rating5" name="rating" value="5">
        <label for="rating5">5 ⭐</label>

        <br><br>


        <!-- Experience -->
        <label for="experience">Your Experience:</label>

        <select id="experience" name="experience" required>
            <option value="">-- Select --</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="average">Average</option>
            <option value="poor">Poor</option>
        </select>

        <br><br>


        <!-- Feedback Message -->
        <label for="feedback">Write Your Feedback:</label>
        <br>

        <textarea
            id="feedback"
            name="feedback"
            rows="6"
            cols="40"
            placeholder="Write your feedback here..."
            minlength="10"
            required
        ></textarea>

        <br><br>


        <!-- What did you like? -->
        <h3>What did you like?</h3>

        <input type="checkbox" id="content" name="liked" value="content">
        <label for="content">Content</label>

        <input type="checkbox" id="design" name="liked" value="design">
        <label for="design">Design</label>

        <input type="checkbox" id="teaching" name="liked" value="teaching">
        <label for="teaching">Teaching</label>

        <input type="checkbox" id="speed" name="liked" value="speed">
        <label for="speed">Speed</label>

        <br><br>


        <!-- Recommendation -->
        <h3>Would you recommend us?</h3>

        <input 
            type="radio" 
            id="yes" 
            name="recommend" 
            value="yes"
            required
        >
        <label for="yes">Yes</label>

        <input 
            type="radio" 
            id="no" 
            name="recommend" 
            value="no"
        >
        <label for="no">No</label>

        <br><br>


        <!-- Date -->
        <label for="date">Feedback Date:</label>
        <input 
            type="date" 
            id="date" 
            name="date"
            required
        >

        <br><br>


        <!-- Terms -->
        <input 
            type="checkbox" 
            id="terms" 
            name="terms"
            required
        >
        <label for="terms">
            I confirm that the feedback given by me is correct.
        </label>

        <br><br>


        <!-- Buttons -->
        <button type="submit">Submit Feedback</button>

        <button type="reset">Reset</button>

    </form>

</body>
</html>
